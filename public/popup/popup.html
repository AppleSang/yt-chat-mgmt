<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>yt-chat-mgmt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="frame">

    <main id="main">

      <section class="card">
        <div class="card-head">
          <img src="../icons/icon128.png" width="16" height="16" alt="" />
          <span data-i18n="popupSettingsCard">Settings</span>
        </div>

        <label class="opt">
          <input type="checkbox" id="enabled" />
          <span data-i18n="popupCleanupOption">Command cleanup</span>
        </label>

        <label class="opt">
          <input type="checkbox" id="autoLiveChat" />
          <span data-i18n="popupAutoLiveChat">Auto-enable “Live chat” mode</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hideBadges" />
          <span data-i18n="popupHideBadges">Hide badges (member / mod)</span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hideAvatars" />
          <span data-i18n="popupHideAvatars">Hide chatter avatars</span>
        </label>
        <!-- modPoll control temporarily hidden (design on hold; the storage
             key and content-script feature stay intact for a later return). -->

        <div class="bot-list">
          <span class="lbl" data-i18n="popupBotList">Hide bots (comma separated)</span>
          <input type="text" id="botList" placeholder="@nightbot, @streamelements, @streamlabs" />
        </div>

        <div class="bot-list">
          <span class="lbl">
            <span data-i18n="popupBotToast">Show bot messages as toasts</span>
            <b id="botToastVal">10s</b>
          </span>
          <input type="range" id="botToastSeconds" min="0" max="35" step="1" />
        </div>
      </section>

      <!-- 7TV section: emote sets + quality toggle grouped apart from chat
           cleanup, headed by the 7TV logo (fill white matches the dark card). -->
      <section class="card">
        <div class="card-head">
          <svg viewBox="8 24 108.148 80" width="16" height="16" fill="white" aria-hidden="true" focusable="false"><path d="M90.986 45.953L95.9196 37.3498L98.584 32.801L93.65 24.1978V24H67.3036L77.1712 41.2064L79.9344 45.953H90.986Z"/><path d="M36.6158 103.703L66.2184 52.0842L69.8692 45.7554L60.0016 28.549L57.2388 24.099H15.598L10.6642 32.7022L8 37.251L12.9338 45.8542V46.052H44.5098L19.841 89.068L16.3874 95.1992L21.3212 103.802V104H36.6158"/><path d="M77.862 103.703H92.9592L112.694 69.29L116.148 63.357L111.214 54.7538V54.556H96.0184L86.1508 71.7624L85.46 73.048L75.5924 55.8415L74.902 54.556L65.0344 71.7624L62.2716 76.5088L77.0728 102.318L77.862 103.703Z"/></svg>
          <span data-i18n="popup7tvCard">7TV settings</span>
        </div>

        <div class="bot-list">
          <span class="lbl" data-i18n="popup7tvSearch">Add 7TV user</span>
          <input type="text" id="sevenTvSearch" placeholder="ohapplesang" />
          <div id="sevenTvResults" class="stv-results"></div>
          <div id="sevenTvAdded" class="stv-added"></div>
        </div>

        <label class="opt">
          <input type="checkbox" id="emoteHq" />
          <span data-i18n="popupEmoteHq">High-quality emoji (4x)</span>
        </label>
        <!-- Visible while the 4x cache pass has not finished: rendering stays on 2x. -->
        <div id="emoteHqWarn" class="stv-warn" data-i18n="popupEmoteHqWarn" hidden></div>
      </section>

      <section class="card logsec">
        <div class="card-head loghead">
          <span data-i18n="popupLogCard">Log</span>
          <span class="count mono">[ <b id="logCount">000</b> ]</span>
          <button id="clearLog" type="button" class="btn btn-secondary" data-i18n="popupClear">Clear</button>
        </div>
        <ul id="logList"></ul>
      </section>

      <!-- Stats: cache footprint + cache-job progress, polled every 3s. -->
      <section class="card">
        <div class="card-head" data-i18n="popupStatsCard">Stats</div>
        <div class="stat-row">
          <span class="lbl" data-i18n="popupStatCache">Cache size</span>
          <b id="statCache">—</b>
        </div>
        <!-- Cache job progress: entries cached / total, ETA at the fixed
             writer rate (30 emotes / 3s). -->
        <div class="stat-progress" id="statProgress" hidden>
          <div class="bar"><div id="statBarFill"></div></div>
          <span id="statBarText">0/0</span>
        </div>
      </section>

    </main>

    <footer class="lang-footer">
      <button type="button" class="issue-btn" id="popupReportIssue">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true" focusable="false" style="flex-shrink:0">
          <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
          <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"></path>
        </svg>
        <span data-i18n="popupReportIssue">Report an issue</span>
      </button>
      <select id="language"></select>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
