<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>yt-chat-mgmt update</title>
  <style>
    /* Same palette tokens as the popup (DESIGN_SYSTEM surfaces), kept local
       because this page is standalone. */
    :root {
      --surface-1: #0f1011;
      --surface-2: #141516;
      --hairline: #23252a;
      --hairline-strong: #34343a;
      --ink: #f7f8f8;
      --ink-subtle: #8a8f98;
      --primary: #5e6ad2;
      --primary-hover: #828fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-1);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      font-size: 14px;
    }
    .wrap {
      width: 340px;
      padding: 28px 24px;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--surface-2);
      text-align: center;
    }
    img { border-radius: 8px; }
    h1 { font-size: 16px; margin: 12px 0 8px; }
    #status { color: var(--ink-subtle); line-height: 1.5; margin: 0 0 16px; }
    #action {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: var(--ink);
      font-size: 14px;
      cursor: pointer;
    }
    #action:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    #action[disabled] { opacity: 0.5; cursor: default; }
    #action[hidden] { display: none; }
    /* Zip-drag installs live inside Chrome's profile, which the File System
       Access API refuses to open - the manual download is their update path. */
    .zip-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--ink-subtle);
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .zip-link:hover { color: var(--ink); }
    .zip-link[hidden] { display: none; }
    .zip-hint {
      margin: 10px 0 0;
      color: var(--ink-subtle);
      font-size: 12px;
      line-height: 1.5;
    }
    .zip-hint[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="../icons/icon128.png" width="48" height="48" alt="" />
    <h1>yt-chat-mgmt</h1>
    <p id="status" data-i18n="updateChecking"></p>
    <button type="button" id="action" hidden></button>
    <a id="zipLink" class="zip-link" href="#" data-i18n="updateZipBtn" hidden></a>
    <p id="zipHint" class="zip-hint" data-i18n="updateZipHint" hidden></p>
  </main>
  <script src="update.js"></script>
</body>
</html>
