name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: Release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./dist/manifest.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=yt-chat-mgmt v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHORT="${GITHUB_SHA:0:7}"
            echo "tag=auto-v${VERSION}-${SHORT}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=yt-chat-mgmt v${VERSION} (auto ${SHORT})" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip dist
        run: (cd dist && zip -qr "../yt-chat-mgmt-${{ steps.meta.outputs.tag }}.zip" .)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: yt-chat-mgmt-${{ steps.meta.outputs.tag }}.zip
          generate_release_notes: true
