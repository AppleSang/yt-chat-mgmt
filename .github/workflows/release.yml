name: Release


on:
  push:
    branches: [main]
    paths:
      - "public/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: Read version
        run: |
          VERSION=$(node -p "require('./dist/manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Zip dist
        run: (cd dist && zip -qr "../yt-chat-mgmt-v${VERSION}.zip" .)

      - name: Build release notes
        run: |
          awk -v head="## ${VERSION}" '
            $0 == head {f = 1; next}
            /^## / {f = 0}
            f
          ' CHANGELOG.md > release_body.md
          if [ -s release_body.md ]; then printf '\n' >> release_body.md; fi
          cat >> release_body.md <<EOF
          ---

          <p align="center"><img src="https://raw.githubusercontent.com/AppleSang/yt-chat-mgmt/refs/heads/main/yt-chat-mgmt-banner.svg" alt="yt-chat-mgmt" /></p>
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yt-chat-mgmt v${{ env.VERSION }}
          prerelease: false
          body_path: release_body.md
          generate_release_notes: false
          files: |
            yt-chat-mgmt-v${{ env.VERSION }}.zip

      - name: Remove source-code archives from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub auto-attaches "Source code (zip/tar.gz)" to every release;
          # the download page should only offer the built extension zip.
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq '.id')
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" --jq '.[] | select(.name | startswith("Source code")) | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > /dev/null
          done
